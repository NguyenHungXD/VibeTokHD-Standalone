name: Build Standalone

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build
        run: |
          # Clean
          rm -rf build/ ~/Library/Developer/Xcode/DerivedData/VibeTok* 2>/dev/null || true

          # Show SDK + xcode info
          echo "=== Xcode info ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo ""

          # Build for iOS device (NOT Mac Catalyst, NOT Mac)
          set -o pipefail
          xcodebuild -project VibeTok.xcodeproj \
            -scheme VibeTok \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/VibeTok.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.0 \
            SUPPORTED_PLATFORMS="iphoneos" \
            TARGETED_DEVICE_FAMILY="1,2" \
            2>&1 | tail -60

      - name: Verify Build
        run: |
          APP_PATH="build/VibeTok.xcarchive/Products/Applications/VibeTok.app"
          echo "=== App contents ==="
          ls -laR "$APP_PATH"
          echo ""
          echo "=== Binary architectures ==="
          lipo -info "$APP_PATH/VibeTok" || file "$APP_PATH/VibeTok"
          echo ""
          echo "=== Linked frameworks (Swift) ==="
          otool -L "$APP_PATH/VibeTok" | grep -i swift | head -10
          echo ""
          echo "=== Embedded frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No embedded Frameworks"

      - name: Create IPA
        run: |
          APP_PATH="build/VibeTok.xcarchive/Products/Applications/VibeTok.app"

          # Show what was built
          echo "=== Built app contents ==="
          find "$APP_PATH" -type f | head -20

          # Copy app to a clean location
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/VibeTok.app

          # Embed Swift standard libs (defensive - in case xcodebuild didn't)
          SWIFT_LIBS_DIR="/Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.5/iphoneos"
          if [ -d "$SWIFT_LIBS_DIR" ]; then
            mkdir -p Payload/VibeTok.app/Frameworks
            cp -n "$SWIFT_LIBS_DIR"/*.dylib Payload/VibeTok.app/Frameworks/ 2>/dev/null || true
            echo "Embedded Swift libs: $(ls Payload/VibeTok.app/Frameworks/ | wc -l)"
          else
            echo "Swift lib dir not found: $SWIFT_LIBS_DIR"
            find /Applications/Xcode*.app/Contents/Developer/Toolchains -name "libswiftCore.dylib" 2>/dev/null | head -3
          fi

          # Adhoc sign
          codesign --force --sign - --timestamp=none --deep Payload/VibeTok.app 2>&1 || true

          # Verify
          codesign -dvv Payload/VibeTok.app 2>&1 | head -10

          # Zip
          cd Payload && zip -r ../VibeTokHD.ipa . && cd ..

          # Stats
          echo "=== Final stats ==="
          ls -la VibeTokHD.ipa
          du -sh VibeTokHD.ipa
          du -sh Payload/VibeTok.app
          find Payload/VibeTok.app -type f -exec ls -la {} \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-Standalone-IPA
          path: VibeTokHD.ipa

name: Build Standalone

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build
        run: |
          # Clean
          rm -rf build/ ~/Library/Developer/Xcode/DerivedData/VibeTok* 2>/dev/null || true

          # Use BUILD (not archive) - gives us .app directly with Frameworks embedded
          set -o pipefail
          xcodebuild -project VibeTok.xcodeproj \
            -scheme VibeTok \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.0 \
            SUPPORTED_PLATFORMS="iphoneos" \
            TARGETED_DEVICE_FAMILY="1,2" \
            build 2>&1 | tail -30

          # Find the built app
          APP_PATH=$(find build/DerivedData -name "VibeTok.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          ls -la "$APP_PATH"
          echo ""
          echo "=== Embedded Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No Frameworks dir"
          echo ""
          echo "=== Binary ==="
          file "$APP_PATH/VibeTok"
          otool -L "$APP_PATH/VibeTok" | head -20

      - name: Verify Build
        run: |
          APP_PATH="build/VibeTok.xcarchive/Products/Applications/VibeTok.app"
          echo "=== App contents ==="
          ls -laR "$APP_PATH"
          echo ""
          echo "=== Binary architectures ==="
          lipo -info "$APP_PATH/VibeTok" || file "$APP_PATH/VibeTok"
          echo ""
          echo "=== Linked frameworks (Swift) ==="
          otool -L "$APP_PATH/VibeTok" | grep -i swift | head -10
          echo ""
          echo "=== Embedded frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No embedded Frameworks"

      - name: Create IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "VibeTok.app" -type d | head -1)
          echo "Using APP_PATH=$APP_PATH"

          # If Frameworks dir doesn't exist, manually add Swift libs
          if [ ! -d "$APP_PATH/Frameworks" ] || [ -z "$(ls -A $APP_PATH/Frameworks 2>/dev/null)" ]; then
            echo "No Frameworks - manually embedding Swift libs"
            SWIFT_LIBS_DIR="/Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.5/iphoneos"
            if [ ! -d "$SWIFT_LIBS_DIR" ]; then
              SWIFT_LIBS_DIR=$(find /Applications/Xcode*.app -name "libswiftCore.dylib" -path "*iphoneos*" 2>/dev/null | head -1 | xargs dirname)
            fi
            if [ -d "$SWIFT_LIBS_DIR" ]; then
              echo "Swift libs at: $SWIFT_LIBS_DIR"
              mkdir -p "$APP_PATH/Frameworks"
              cp -R "$SWIFT_LIBS_DIR"/. "$APP_PATH/Frameworks/"
              echo "Copied $(ls $APP_PATH/Frameworks/ | wc -l) libs"
            fi
          fi

          # Copy app to clean location
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/VibeTok.app

          # Adhoc sign
          codesign --force --sign - --timestamp=none --deep Payload/VibeTok.app 2>&1 | head -5

          # Verify
          echo "=== After embed ==="
          find Payload/VibeTok.app -type f | head -20
          du -sh Payload/VibeTok.app

          # Zip
          cd Payload && zip -r ../VibeTokHD.ipa . > /dev/null && cd ..
          ls -la VibeTokHD.ipa
          du -h VibeTokHD.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-Standalone-IPA
          path: VibeTokHD.ipa

name: Build Standalone

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Build
        run: |
          # Clean
          rm -rf build/ ~/Library/Developer/Xcode/DerivedData/VibeTok* 2>/dev/null || true

          # Use BUILD (not archive) - gives us .app directly with Frameworks embedded
          xcodebuild -project VibeTok.xcodeproj \
            -scheme VibeTok \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            VALID_ARCHS="arm64" \
            ENABLE_BITCODE=NO \
            SWIFT_VERSION=5.0 \
            SUPPORTED_PLATFORMS="iphoneos" \
            TARGETED_DEVICE_FAMILY="1,2" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build

          # Find the built app
          APP_PATH=$(find build/DerivedData -name "VibeTok.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH"
          echo "=== Embedded Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No Frameworks dir"

      - name: Verify Build
        if: always()
        run: |
          APP_PATH=$(find build/DerivedData -name "VibeTok.app" -type d | head -1)
          echo "=== App contents ==="
          ls -laR "$APP_PATH" || true
          echo ""
          echo "=== Binary architectures ==="
          lipo -info "$APP_PATH/VibeTok" 2>/dev/null || file "$APP_PATH/VibeTok" || true
          echo ""
          echo "=== Linked frameworks (Swift) ==="
          otool -L "$APP_PATH/VibeTok" 2>/dev/null | grep -i swift | head -10 || true
          echo ""
          echo "=== Embedded frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No embedded Frameworks"

      - name: Create IPA
        if: always()
        run: |
          APP_PATH=$(find build/DerivedData -name "VibeTok.app" -type d | head -1)
          echo "Using APP_PATH=$APP_PATH"

          # Always manually embed Swift libs (Xcode 15 with --filter-for-swift-os may skip)
          SWIFT_LIBS_DIR="/Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.5/iphoneos"
          if [ ! -d "$SWIFT_LIBS_DIR" ]; then
            SWIFT_LIBS_DIR=$(find /Applications/Xcode*.app -name "libswiftCore.dylib" -path "*iphoneos*" 2>/dev/null | head -1 | xargs dirname)
          fi
          if [ -d "$SWIFT_LIBS_DIR" ]; then
            echo "Swift libs source: $SWIFT_LIBS_DIR"
            echo "Found $(ls $SWIFT_LIBS_DIR | wc -l) libs"
            mkdir -p "$APP_PATH/Frameworks"
            cp -R "$SWIFT_LIBS_DIR"/. "$APP_PATH/Frameworks/"
            echo "Embedded $(ls $APP_PATH/Frameworks/ | wc -l) Swift libs"
          else
            echo "Swift lib dir not found, trying alternate locations..."
            find /Applications/Xcode*.app -name "libswiftCore.dylib" 2>/dev/null | head -5
          fi

          # Copy app
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/VibeTok.app

          # Verify Payload structure
          echo "=== Payload structure ==="
          ls -la Payload/
          ls -la Payload/VibeTok.app/

          # Adhoc sign
          codesign --force --sign - --timestamp=none --deep Payload/VibeTok.app 2>&1 | head -5

          # Final check
          echo "=== Final app ==="
          find Payload/VibeTok.app -type f | head -30
          du -sh Payload/VibeTok.app

          # Zip - must keep Payload/ folder structure!
          cd Payload && zip -r ../VibeTokHD.ipa . > /dev/null && cd ..
          echo "=== IPA verification ==="
          unzip -l VibeTokHD.ipa | head -20
          ls -la VibeTokHD.ipa
          du -h VibeTokHD.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeTokHD-Standalone-IPA
          path: VibeTokHD.ipa
